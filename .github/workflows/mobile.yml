# Android (APK + AAB) and iPad (IPA) builds. See docs/mobile.md for the secrets.
#
# * Release: release.yml calls this workflow on a `v*` tag; the files are attached to the
#   GitHub release next to the desktop installers.
# * Testing: Actions › Mobile › Run workflow on any branch → download the files from the run's
#   "Artifacts" section. Pull requests that touch the mobile shells build too (unsigned).
#
# Without signing secrets everything still builds: the APK is signed with a debug key
# (installable by hand), the IPA is unsigned (sideload tools re-sign it) and a simulator build is
# included for testing on a Mac.
name: Mobile

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which apps to build
        type: choice
        options: [both, android, ios]
        default: both
  workflow_call:
    inputs:
      platforms:
        type: string
        default: both
  pull_request:
    paths:
      - "mobile/**"
      - "crates/ezyx-mobile/**"
      - "crates/ezyx-app/src/platform.rs"
      - ".github/workflows/mobile.yml"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
            release=true
          else
            name=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            release=false
          fi
          # App stores only take numeric x.y.z versions (drop "-beta.1" etc.).
          name="${name%%-*}"
          # Store build numbers must always grow: minutes since 2024-01-01.
          code=$(( ($(date +%s) - 1704067200) / 60 ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $name ($code), release=$release"

  android:
    name: android
    needs: version
    if: inputs.platforms != 'ios'
    runs-on: ubuntu-latest
    env:
      EZYX_VERSION_NAME: ${{ needs.version.outputs.name }}
      EZYX_VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build the Rust library (arm64 phones/tablets + x86_64 emulators)
        shell: bash
        run: |
          # The runner image ships the Android SDK and NDK.
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t x86_64 -P 26 -o mobile/android/app/src/main/jniLibs build --release -p ezyx-mobile
          ls -la mobile/android/app/src/main/jniLibs/*
      - name: Release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            {
              echo "EZYX_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "EZYX_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "EZYX_ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "EZYX_ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
              echo "SIGNED=true"
            } >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with the debug key (for testing only)."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi
      - name: Package APK and AAB
        run: gradle -p mobile/android --no-daemon assembleRelease bundleRelease
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          base="EZ-YX-craft-${EZYX_VERSION_NAME}-android"
          if [ "$SIGNED" = true ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/$base.apk"
            cp mobile/android/app/build/outputs/bundle/release/app-release.aab "out/$base.aab"
          else
            cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/$base-test.apk"
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
      - name: Attach to the release
        if: needs.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

  ios:
    name: ipad
    needs: version
    if: inputs.platforms != 'android'
    # Apple-silicon runner: the simulator build is arm64.
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.name }}
      BUILD: ${{ needs.version.outputs.code }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'org.ezyxcraft.app' }}
      PROJECT: mobile/ios/EZYXCraft.xcodeproj
      SCHEME: EZ-YX-craft
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        shell: bash
        run: |
          # winit 0.30 has no UIScene support, which the iOS 27 SDK will require; build with the
          # iOS 26 SDK (accepted by the App Store) until winit gains it.
          xc=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$xc" ]; then sudo xcode-select -s "$xc/Contents/Developer"; else echo "::warning::Xcode 26 not found, using the default Xcode"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Build the Rust library (iPad + simulator)
        run: mobile/ios/build-rust.sh
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec mobile/ios/project.yml
      - name: Simulator build (for testing on a Mac)
        shell: bash
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO build
          mkdir -p out
          (cd build/sim/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/out/EZ-YX-craft-$VERSION-ipad-simulator.app.zip" EZ-YX-craft.app)
      - name: Device build (unsigned IPA)
        shell: bash
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          rm -rf Payload && mkdir Payload
          cp -R build/device/Build/Products/Release-iphoneos/EZ-YX-craft.app Payload/
          zip -qry "out/EZ-YX-craft-$VERSION-ipad-unsigned.ipa" Payload
      - name: Signing identity and provisioning profile
        id: sign
        shell: bash
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$CERT_B64" ] || [ -z "$PROFILE_B64" ]; then
            echo "No iOS signing secrets: skipping the signed IPA."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kc="$RUNNER_TEMP/ezyx.keychain-db"
          kcpass=$(openssl rand -hex 16)
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" | awk 'NR==1 {print $2}')
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP/profile.mobileprovision" "$d/$uuid.mobileprovision"
          done
          # Ad hoc profiles list devices; App Store profiles don't.
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            method=release-testing
          else
            method=app-store-connect
          fi
          {
            echo "enabled=true"
            echo "identity=$identity"
            echo "profile=$name"
            echo "team=$team"
            echo "method=$method"
            echo "keychain=$kc"
          } >> "$GITHUB_OUTPUT"
          echo "Signing with $identity, profile '$name' ($method), team $team"
      - name: Signed IPA
        if: steps.sign.outputs.enabled == 'true'
        shell: bash
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
          PROFILE: ${{ steps.sign.outputs.profile }}
          TEAM: ${{ steps.sign.outputs.team }}
          METHOD: ${{ steps.sign.outputs.method }}
          KEYCHAIN: ${{ steps.sign.outputs.keychain }}
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath build/EZ-YX-craft.xcarchive \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE" OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" archive
          opts="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string $METHOD" \
            -c "Add :teamID string $TEAM" \
            -c "Add :signingStyle string manual" \
            -c "Add :signingCertificate string $IDENTITY" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE" \
            -c "Add :uploadSymbols bool false" "$opts"
          xcodebuild -exportArchive -archivePath build/EZ-YX-craft.xcarchive -exportOptionsPlist "$opts" -exportPath build/export
          cp build/export/*.ipa "out/EZ-YX-craft-$VERSION-ipad.ipa"
      - name: Upload to TestFlight
        if: steps.sign.outputs.enabled == 'true' && steps.sign.outputs.method == 'app-store-connect' && needs.version.outputs.release == 'true'
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "No App Store Connect API key secrets: not uploading to TestFlight."
            exit 0
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -t ios -f "out/EZ-YX-craft-$VERSION-ipad.ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Clean up the keychain
        if: always() && steps.sign.outputs.enabled == 'true'
        run: security delete-keychain "${{ steps.sign.outputs.keychain }}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ipad
          path: out/*
      - name: Attach to the release
        if: needs.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.ipa
            out/*-simulator.app.zip
