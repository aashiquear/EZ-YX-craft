name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: cargo fmt --all -- --check
        continue-on-error: true
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true
      - name: End-to-end smoke test (CLI)
        shell: bash
        run: |
          cargo run -q -p ezyx-cli --release -- demo -o demo.ezyx
          cargo run -q -p ezyx-cli --release -- gcode demo.ezyx -o demo.nc
          cargo run -q -p ezyx-cli --release -- sim demo.ezyx -o preview.png
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: demo-output
          path: |
            demo.nc
            preview.png
