name: Docs

# The user manual (docs/manual) is generated from the app's feature registry and kept current by
# tools/docs/update_manual.py. See CONTRIBUTING.md > "User manual".
#   pull_request      -> check: the PR must commit the regenerated registry + scaffold output
#   push to main      -> update: screenshots + LLM revision -> PR on branch docs/manual-update
#                        deploy: publish the committed manual to GitHub Pages
#   workflow_dispatch -> update + deploy on demand

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "docs/manual/**"
      - "tools/docs/**"
      - "examples/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "crates/**"
      - "docs/manual/**"
      - "tools/docs/**"
      - "examples/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      revise:
        description: "Run the LLM revision step (needs the ANTHROPIC_API_KEY secret)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: "1"
  MDBOOK_VERSION: "0.4.40"

jobs:
  check:
    name: check manual
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests for the docs tooling
        run: python3 -m unittest discover tools/docs
      - name: Build CLI
        run: cargo build --release -p ezyx-cli
      - name: Export the feature registry
        run: target/release/ezyx docs-registry -o docs/manual/registry.json
      - name: Scaffold
        run: python3 tools/docs/update_manual.py scaffold
      - name: Check
        run: python3 tools/docs/update_manual.py check
      - name: Fail if the PR is missing registry / scaffold changes
        run: |
          # changelog.md depends on the commits in the PR itself, so it is regenerated by the update job instead.
          changes="$(git status --porcelain -- docs/manual ':(exclude)docs/manual/src/changelog.md')"
          if [ -n "$changes" ]; then
            echo "$changes"
            git --no-pager diff --stat -- docs/manual ':(exclude)docs/manual/src/changelog.md'
            git --no-pager diff -- docs/manual ':(exclude)docs/manual/src/changelog.md' | head -n 200
            echo "::error title=User manual out of date::The feature registry or the manual scaffold changed but this PR does not include it. Run: cargo run -q -p ezyx-cli --release -- docs-registry -o docs/manual/registry.json && python3 tools/docs/update_manual.py scaffold  then commit docs/manual."
            exit 1
          fi

  update:
    name: update manual (screenshots + LLM revision)
    # Skip the push that merges the bot's own PR, so the manual does not chase its tail.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, 'docs/manual-update') &&
       !startsWith(github.event.head_commit.message, 'docs: update user manual'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # revise/changelog read the history since the last manual revision
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI deps + virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libgl1-mesa-dri libegl1 libxkbcommon-x11-0 mesa-vulkan-drivers xvfb xauth
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Anthropic SDK (optional; update_manual.py falls back to urllib)
        continue-on-error: true
        run: python -m pip install --upgrade anthropic
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: ${{ env.MDBOOK_VERSION }}
      - name: Build app and CLI
        run: cargo build --release -p ezyx-app -p ezyx-cli
      - name: Export the feature registry
        run: target/release/ezyx docs-registry -o docs/manual/registry.json
      - name: Render screenshots
        id: shots
        continue-on-error: true
        run: tools/docs/render_shots.sh --no-build --no-registry
      - name: Fall back to the CLI preview image
        if: steps.shots.outcome == 'failure'
        run: |
          echo "::warning::GUI screenshot rendering failed; missing screenshots use the CLI preview image."
          python tools/docs/update_manual.py placeholders --fallback docs/manual/src/img/cli_sim_preview.png
      - name: Update the manual (scaffold -> revise -> check)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EZYX_DOCS_MODEL: ${{ vars.EZYX_DOCS_MODEL }}
          REVISE: ${{ github.event_name != 'workflow_dispatch' || inputs.revise }}
        run: |
          args=(--summary-file "$RUNNER_TEMP/manual-summary.md")
          if [ "$REVISE" = "false" ]; then args+=(--skip-revise); fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::notice::ANTHROPIC_API_KEY is not set; the LLM revision step only reports what it would change."; fi
          python tools/docs/update_manual.py all "${args[@]}"
      - name: Build the book
        run: mdbook build docs/manual
      - uses: actions/upload-artifact@v4
        with:
          name: user-manual
          path: docs/manual/book
          retention-days: 14
      - name: Write the PR description
        env:
          SHOTS: ${{ steps.shots.outcome }}
        run: |
          {
            echo "Automated update of the user manual from the feature registry and the changes on \`main\` up to ${GITHUB_SHA::8}."
            echo
            echo "Generated by \`tools/docs/update_manual.py all\` in the [Docs workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). The built book is attached to the run as the \`user-manual\` artifact."
            echo
            if [ "$SHOTS" = "failure" ]; then
              echo "> **Warning:** GUI screenshots could not be rendered; missing ones use the CLI preview image as a placeholder (see \`docs/manual/src/img/placeholders.json\`)."
              echo
            fi
            cat "$RUNNER_TEMP/manual-summary.md" 2>/dev/null || true
            echo
            echo "Review the prose for accuracy before merging; hand-written text outside \`<!-- feature:... -->\` markers is preserved unless it became wrong."
          } > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open or refresh the docs PR
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT (secret DOCS_PR_TOKEN) lets the PR trigger the `check` job; GITHUB_TOKEN PRs do not run workflows.
          token: ${{ secrets.DOCS_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: docs/manual-update
          delete-branch: true
          title: "docs: update user manual"
          commit-message: "docs: update user manual"
          labels: documentation
          add-paths: |
            docs/manual/**
          body-path: ${{ runner.temp }}/pr-body.md

  deploy:
    name: deploy manual to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: ${{ env.MDBOOK_VERSION }}
      - name: Check the committed manual
        continue-on-error: true
        run: python3 tools/docs/update_manual.py check
      - name: Build the book
        run: mdbook build docs/manual
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/manual/book
      - id: deployment
        uses: actions/deploy-pages@v4
