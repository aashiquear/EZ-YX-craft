[package]
name = "ezyx-machine"
description = "CNC machine control for EZ-YX-craft: GRBL protocol, USB serial, Wi-Fi (TCP/telnet and WebSocket) transports, job streaming"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["serial"]
serial = ["dep:serialport"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
tungstenite.workspace = true
log.workspace = true

# No serial ports for apps on Android/iOS (see build.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
serialport = { workspace = true, optional = true }
