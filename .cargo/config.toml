# Android 15+ devices may use 16 KB memory pages; Google Play requires native libraries aligned
# for them (NDK r28+ does this by default, older NDKs need the flag).
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
